<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trésorerie AEROGOMM 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0D1117; --surface:#161B22; --surface2:#1C2128; --surface3:#21262D;
    --border:#30363D; --border2:#484F58; --text:#E6EDF3; --muted:#8B949E; --accent:#58A6FF;
    --prgo:#2E8BC0; --prgo-bg:#0D2D45;
    --ls:#3FB27F;   --ls-bg:#0D2D1E;
    --lm:#D4A017;   --lm-bg:#2D2200;
    --lmpm:#A87DC4; --lmpm-bg:#241535;
    --vm:#2EC4B6;   --vm-bg:#0D2A28;
    --fg:#E07B39;   --fg-bg:#2D1800;
    --rd:#E05252;   --rd-bg:#2D0C0C;
    --income:#3FB27F; --expense:#E05252; --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;height:60px;
    position:sticky;top:0;z-index:100;}
  .app-logo{font-size:16px;font-weight:800;letter-spacing:-.5px;}
  .app-logo span{color:var(--accent);}
  .header-actions{display:flex;gap:10px;align-items:center;}
  .layout{display:flex;min-height:calc(100vh - 60px);}
  .sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    padding:16px 0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;}
  .sidebar-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);
    padding:8px 16px 4px;text-transform:uppercase;}
  .month-btn{display:flex;align-items:center;justify-content:space-between;width:100%;
    padding:8px 16px;background:none;border:none;cursor:pointer;color:var(--muted);
    font-family:'Syne',sans-serif;font-size:13px;font-weight:600;transition:all .15s;
    border-left:3px solid transparent;}
  .month-btn:hover{color:var(--text);background:var(--surface2);}
  .month-btn.active{color:var(--accent);background:var(--surface2);border-left-color:var(--accent);}
  .month-btn.ls-btn.active{color:var(--ls);border-left-color:var(--ls);}
  .month-badge{font-family:'DM Mono',monospace;font-size:10px;background:var(--surface3);
    border-radius:10px;padding:1px 7px;color:var(--muted);}
  .month-btn.active .month-badge{background:var(--accent);color:#000;}
  .month-btn.ls-btn.active .month-badge{background:var(--ls);color:#000;}
  .month-btn.dc-btn.active{color:var(--rd);border-left-color:var(--rd);}
  .month-btn.dc-btn.active .month-badge{background:var(--rd);color:#fff;}
  .month-btn.hist-btn.active{color:var(--lm);border-left-color:var(--lm);}
  .month-btn.marge-btn.active{color:var(--vm);border-left-color:var(--vm);}
  .dc-banner{background:linear-gradient(135deg,#2D0C0C,#1F2D0C);border:1px solid var(--rd);border-radius:10px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .dc-banner-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;}
  .dc-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
  .dc-section-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
  .dc-section-title{font-size:13px;font-weight:700;}
  .dc-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;}
  .dc-tag-monthly{background:#2D0C0C;color:var(--rd);}
  .dc-tag-quarterly{background:#2D1800;color:var(--fg);}
  .dc-tag-debt{background:#241535;color:var(--lmpm);}
  .progress-bar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:4px;}
  .progress-fill{height:100%;border-radius:3px;transition:width .3s;}
  .main{flex:1;padding:24px;overflow:auto;}
  .page-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
  .page-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
  .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--muted);margin-bottom:12px;margin-top:24px;}
  .service-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .svc-chip{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;
    letter-spacing:.5px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;}
  .svc-chip.active{border-color:currentColor;}
  .svc-chip[data-svc="PRGO"]{color:var(--prgo);background:var(--prgo-bg);}
  .svc-chip[data-svc="LS"]{color:var(--ls);background:var(--ls-bg);}
  .svc-chip[data-svc="LM"]{color:var(--lm);background:var(--lm-bg);}
  .svc-chip[data-svc="LMPM"]{color:var(--lmpm);background:var(--lmpm-bg);}
  .svc-chip[data-svc="VM"]{color:var(--vm);background:var(--vm-bg);}
  .svc-chip[data-svc="FG"]{color:var(--fg);background:var(--fg-bg);}
  .svc-chip[data-svc="RD"]{color:var(--rd);background:var(--rd-bg);}
  .svc-chip[data-svc="ALL"]{color:var(--accent);background:#0D2040;}
  .add-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:20px;}
  .add-card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
    color:var(--muted);margin-bottom:12px;}
  .form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .form-group{display:flex;flex-direction:column;gap:4px;}
  .form-group label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
  .form-group input,.form-group select{background:var(--surface2);border:1px solid var(--border);
    color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:8px 12px;
    border-radius:var(--radius);outline:none;transition:border-color .15s;}
  .form-group input:focus,.form-group select:focus{border-color:var(--accent);}
  .form-group select option{background:var(--surface2);}
  .type-toggle{display:flex;}
  .type-btn{padding:8px 16px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;
    cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .15s;}
  .type-btn:first-child{border-radius:var(--radius) 0 0 var(--radius);}
  .type-btn:last-child{border-radius:0 var(--radius) var(--radius) 0;border-left:0;}
  .type-btn.active-e{background:var(--income);color:#fff;border-color:var(--income);}
  .type-btn.active-d{background:var(--expense);color:#fff;border-color:var(--expense);}
  .btn{padding:8px 20px;border-radius:var(--radius);font-family:'Syne',sans-serif;font-size:13px;
    font-weight:700;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--accent);color:#000;}
  .btn-primary:hover{background:#79B8FF;}
  .btn-success{background:var(--income);color:#fff;}
  .btn-success:hover{filter:brightness(1.1);}
  .btn-ls{background:var(--ls);color:#fff;}
  .btn-ls:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn-ghost:hover{border-color:var(--border2);color:var(--text);}
  .btn-danger-sm{background:none;border:none;cursor:pointer;color:var(--muted);padding:2px 6px;
    border-radius:4px;font-size:12px;transition:all .15s;}
  .btn-danger-sm:hover{color:var(--expense);background:var(--rd-bg);}
  .stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px;}
  .stat-value{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;}
  .stat-value.positive{color:var(--income);}
  .stat-value.negative{color:var(--expense);}
  .stat-value.neutral{color:var(--accent);}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
  .table-header-bar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-bottom:1px solid var(--border);}
  .table-title{font-size:13px;font-weight:700;}
  .ops-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
  table{width:100%;border-collapse:collapse;}
  thead th{background:var(--surface2);padding:9px 14px;font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:left;white-space:nowrap;}
  tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--surface2);}
  tbody td{padding:9px 14px;font-size:13px;}
  .td-date{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;}
  .td-date-input{font-family:'DM Mono',monospace;font-size:12px;color:var(--text);background:var(--surface2);
    border:1px solid var(--border);border-radius:5px;padding:3px 6px;width:120px;outline:none;}
  .td-date-input:focus{border-color:var(--accent);}
  .td-solde{font-family:'DM Mono',monospace;font-size:12px;font-weight:600;text-align:right;white-space:nowrap;color:var(--muted);}
  .td-solde.positive{color:var(--income);}
  .td-solde.negative{color:var(--expense);}
  .drag-handle{cursor:grab;color:var(--muted);font-size:13px;padding:0 6px;user-select:none;}
  .drag-handle:active{cursor:grabbing;}
  tbody tr.op-row{transition:background .12s,opacity .12s;}
  tbody tr.op-row.dragging{opacity:.4;}
  tbody tr.op-row.drag-over{background:var(--surface3);box-shadow:inset 0 2px 0 var(--accent);}
  .month-btn.drag-target{background:var(--accent) !important;color:#000 !important;border-left-color:var(--accent) !important;}
  .td-svc{font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 9px;border-radius:10px;display:inline-block;}
  .td-amount{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;text-align:right;white-space:nowrap;}
  .td-amount.e{color:var(--income);}
  .td-amount.d{color:var(--expense);}
  .type-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;}
  .type-badge.e{background:#0D2D1E;color:var(--income);}
  .type-badge.d{background:var(--rd-bg);color:var(--expense);}
  .empty-state{text-align:center;padding:48px 24px;color:var(--muted);font-size:14px;}
  .empty-icon{font-size:32px;margin-bottom:8px;}

  /* ── LS Module ── */
  .ls-banner{background:linear-gradient(135deg,#0D2D1E,#0D2040);border:1px solid var(--ls);
    border-radius:10px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;
    gap:24px;flex-wrap:wrap;}
  .ls-banner-item{display:flex;flex-direction:column;gap:2px;}
  .ls-banner-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .ls-banner-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--ls);}
  .fact-alert{background:#2D2200;border:1px solid var(--lm);border-radius:var(--radius);
    padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;}
  .ls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px;}
  .loc-card{background:var(--surface);border:1px solid #1A3A28;border-radius:10px;padding:16px;transition:border-color .2s;}
  .loc-card:hover{border-color:var(--ls);}
  .loc-card.inactive{opacity:.5;border-color:var(--border);}
  .loc-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
  .loc-name{font-size:14px;font-weight:800;}
  .loc-site{font-size:11px;color:var(--muted);margin-top:2px;}
  .loc-status{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;}
  .loc-status.active{background:#0D2D1E;color:var(--income);}
  .loc-status.inactive{background:var(--surface3);color:var(--muted);}
  .loc-details{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-bottom:12px;}
  .loc-detail-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
  .loc-detail-val{font-family:'DM Mono',monospace;font-weight:500;}
  .loc-billing{background:var(--surface2);border-radius:6px;padding:10px;margin-bottom:10px;}
  .loc-billing-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ls);margin-bottom:6px;}
  .billing-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:5px;}
  .billing-row:last-child{margin-bottom:0;}
  .bill-date{font-family:'DM Mono',monospace;color:var(--muted);}
  .bill-amount{font-family:'DM Mono',monospace;font-weight:700;color:var(--income);}
  .bill-status-btn{font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;cursor:pointer;
    border:none;font-family:'Syne',sans-serif;transition:all .15s;}
  .bill-pending{background:#2D2200;color:var(--lm);}
  .bill-pending:hover{background:var(--lm);color:#000;}
  .bill-received{background:#0D2D1E;color:var(--income);cursor:default;}
  .loc-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .loc-action-btn{font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;cursor:pointer;
    font-family:'Syne',sans-serif;border:1px solid;transition:all .15s;}
  .totals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px;}
  .svc-total-card{border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);}
  .svc-total-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .svc-total-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
  .svc-total-row span:first-child{color:var(--muted);}
  .svc-total-net{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;font-weight:700;font-size:13px;}
  .export-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 20px;margin-top:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .export-info{flex:1;min-width:200px;}
  .export-title{font-size:14px;font-weight:700;margin-bottom:2px;}
  .export-sub{font-size:12px;color:var(--muted);}
  .notif{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--radius);padding:12px 18px;font-size:13px;font-weight:600;
    transform:translateY(80px);opacity:0;transition:all .3s;z-index:200;}
  .notif.show{transform:translateY(0);opacity:1;}
  .notif.success{border-color:var(--income);color:var(--income);}
  .notif.error{border-color:var(--expense);color:var(--expense);}
  #loading-overlay{display:none;position:fixed;inset:0;background:rgba(13,17,23,.85);z-index:300;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;}
  #loading-overlay.show{display:flex;}
  .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media(max-width:768px){.sidebar{display:none;}.main{padding:16px;}.form-row{flex-direction:column;}.stats-bar{grid-template-columns:1fr 1fr;}}

  /* Airtable sync */
  .drive-bar{display:flex;align-items:center;gap:10px;padding:6px 16px;background:#0D1F0D;border-bottom:1px solid #1A3A1A;font-size:12px;}
  .drive-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .drive-dot.ok{background:var(--income);}
  .drive-dot.warn{background:var(--lm);}
  .drive-dot.err{background:var(--rd);}
  .drive-dot.idle{background:var(--border2);}
  .drive-status{color:var(--muted);flex:1;}
  .drive-config{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:16px 0;max-width:520px;}
  .drive-config-title{font-size:13px;font-weight:700;color:var(--ls);margin-bottom:12px;}
  .sync-spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
</style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><div style="color:var(--muted);font-size:14px">Génération…</div></div>
<header class="app-header">
  <div class="app-logo">Tréso<span>2026</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost" onclick="showFactureFournisseurPanel()">🧾 Facture fournisseur</button>
    <button class="btn btn-ghost" onclick="showAirtableConfigPanel()">⚙ Airtable</button>
    <button class="btn btn-ghost" id="btn-at-sync-chantiers" onclick="syncChantiers()">🏗 Sync Chantiers</button>
    <button class="btn btn-ghost" id="btn-at-save" onclick="airtableSaveAll()">☁ Sauvegarder</button>
    <button class="btn btn-ghost" onclick="exportData()">💾 Local</button>
    <button class="btn btn-success" onclick="generateExcel()">📊 Générer Excel</button>
  </div>
</header>
<div class="drive-bar" id="at-bar">
  <div class="drive-dot idle" id="at-dot"></div>
  <span class="drive-status" id="at-status">Airtable non configuré</span>
  <span id="at-last-sync" style="font-size:11px;color:var(--muted)"></span>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label">Navigation</div>
    <button class="month-btn active" data-month="0" onclick="switchView('annual',this)">
      Vue annuelle <span class="month-badge" id="badge-0">0</span>
    </button>
    <button class="month-btn ls-btn" data-month="ls" onclick="switchView('ls',this)">
      🏠 Locations LS <span class="month-badge" id="badge-ls">0</span>
    </button>
    <button class="month-btn dc-btn" data-month="dc" onclick="switchView('dc',this)">
      &#x1F4CB; Dettes &amp; Charges <span class="month-badge" id="badge-dc">0</span>
    </button>
    <button class="month-btn hist-btn" data-month="hist" onclick="switchView('hist',this)">
      🕐 Historique
    </button>
    <button class="month-btn marge-btn" data-month="marge" onclick="switchView('marge',this)">
      📊 Marge &amp; Résultat
    </button>
    <div class="sidebar-label" style="margin-top:8px">Mois 2026</div>
    <div id="month-nav"></div>
  </aside>
  <main class="main"><div id="page-content"></div></main>
</div>
<div id="notif" class="notif"></div>

<script>
const MONTHS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const SERVICES=[
  {code:"PRGO",label:"Prestations Grand Ouest",color:"var(--prgo)",bg:"var(--prgo-bg)"},
  {code:"LS",  label:"Location Site",          color:"var(--ls)",  bg:"var(--ls-bg)"},
  {code:"LM",  label:"Location Matérielle",    color:"var(--lm)",  bg:"var(--lm-bg)"},
  {code:"LMPM",label:"Prest. Le Mans/Perche/May",color:"var(--lmpm)",bg:"var(--lmpm-bg)"},
  {code:"VM",  label:"Vente Matérielle",       color:"var(--vm)",  bg:"var(--vm-bg)"},
  {code:"FG",  label:"Frais Généraux",         color:"var(--fg)",  bg:"var(--fg-bg)"},
  {code:"RD",  label:"Remboursement Dettes",   color:"var(--rd)",  bg:"var(--rd-bg)"},
];

let data={};
let lsData={locataires:[],factures:{}};
let dcData={
  dettes:[],     // [{id,nom,credancier,montantTotal,montantPaye,mensualite,dateDebut,notes}]
  charges:[]     // [{id,nom,type:'mensuelle'|'trimestrielle'|'annuelle',montant,mois:[],organisme,notes,historique:[{mois,paye,date}]}]
};
for(let m=1;m<=12;m++){data[m]={};SERVICES.forEach(s=>data[m][s.code]=[]);}

let view="annual"; // "annual"|"ls"|1..12
let currentSvc="ALL";
let formType="E";
const TVA_RATES=[
  {value:20,label:"20 %"},
  {value:10,label:"10 %"},
  {value:5.5,label:"5,5 %"},
  {value:2.1,label:"2,1 %"},
  {value:0,label:"Sans TVA"},
  {value:"libre",label:"✎ Saisie libre du montant"}
];
let collaborateurs = JSON.parse(localStorage.getItem('treso_collaborateurs')||'null') || ['Julien','Jonathan','Jérôme','Carole','Raynald'];
function saveCollaborateurs(){localStorage.setItem('treso_collaborateurs', JSON.stringify(collaborateurs));}
let benefFieldOpen=false;
function toggleBenefField(){benefFieldOpen=!benefFieldOpen;render();}
function handleBenefSelect(sel){
  if(sel.value==='__new__'){
    const name=prompt('Nom du nouveau collaborateur :');
    if(name && name.trim() && !collaborateurs.includes(name.trim())){
      const clean=name.trim();
      collaborateurs.push(clean);
      saveCollaborateurs();
      notify(`Collaborateur "${clean}" ajouté à la liste`,"success");
      pushCollaborateurToAirtable(clean);
      render();
    } else {
      sel.value='';
    }
  }
}
async function pushCollaborateurToAirtable(nom){
  if(!airtableState.token||!airtableState.base)return; // pas encore configuré, restera local pour l'instant
  try{
    await atCreateAll(AT_TABLES.collaborateurs, [{Nom:nom}]);
  }catch(e){
    notify('Collaborateur ajouté localement, mais échec de sync Airtable : '+e.message,'error');
  }
}

function initNav(){
  const nav=document.getElementById("month-nav");
  MONTHS.forEach((m,i)=>{
    nav.innerHTML+=`<button class="month-btn" data-month="${i+1}" onclick="switchView(${i+1},this)"
      ondragover="monthDragOver(event)" ondragleave="monthDragLeave(event)" ondrop="monthDrop(event,${i+1})">${m} <span class="month-badge" id="badge-${i+1}">0</span></button>`;
  });
  render();
}

function updateBadges(){
  for(let m=1;m<=12;m++){
    let t=0;SERVICES.forEach(s=>t+=(data[m][s.code]||[]).length);
    const b=document.getElementById(`badge-${m}`);if(b)b.textContent=t;
  }
  let g=0;for(let m=1;m<=12;m++)SERVICES.forEach(s=>g+=(data[m][s.code]||[]).length);
  const b0=document.getElementById("badge-0");if(b0)b0.textContent=g;
  const bls=document.getElementById("badge-ls");
  if(bls)bls.textContent=lsData.locataires.filter(l=>l.actif).length;
  const bdc=document.getElementById("badge-dc");
  if(bdc)bdc.textContent=dcData.dettes.length+dcData.charges.length;
}

function switchView(v,btn){
  view=v;lsAddMode=false;
  document.querySelectorAll(".month-btn").forEach(b=>b.classList.remove("active"));
  if(btn)btn.classList.add("active");
  render();
}

function render(){
  if(view==="annual")renderAnnual();
  else if(view==="ls")renderLS();
  else if(view==="dc")renderDC();
  else if(view==="hist")renderHistorique();
  else if(view==="marge")renderMarge();
  else renderMonth(view);
}

function locCard(loc,mKey){
  const facs=(lsData.factures[loc.id]||{})[mKey]||[];
  const f15=facs.find(f=>f.echeance===15);
  const f25=facs.find(f=>f.echeance===25);

  const billLine=(ech,loyer,fac)=>{
    if(!loyer||parseFloat(loyer)<=0) return '';
    if(!fac) return `<div class="billing-row"><span class="bill-date">Le ${ech}</span><span class="bill-amount">${fmt(parseFloat(loyer))}</span><span style="font-size:10px;color:var(--muted);font-style:italic">Non générée</span></div>`;
    const isR=fac.statut==='received';
    return `<div class="billing-row">
      <span class="bill-date">Le ${ech}</span>
      <span class="bill-amount">${fmt(fac.montant)}</span>
      ${isR?`<span class="bill-status-btn bill-received">✓ Encaissé</span>`
           :`<button class="bill-status-btn bill-pending" onclick="encaisser('${loc.id}','${mKey}',${ech})">Marquer encaissé</button>`}
    </div>`;
  };

  return `<div class="loc-card">
    <div class="loc-card-header">
      <div><div class="loc-name">${loc.nom}</div><div class="loc-site">${loc.site||'—'}</div></div>
      <span class="loc-status active">Actif</span>
    </div>
    <div class="loc-details">
      <div><div class="loc-detail-label">Entrée</div><div class="loc-detail-val">${loc.dateEntree||'—'}</div></div>
      <div><div class="loc-detail-label">Sortie prévue</div><div class="loc-detail-val">${loc.dateSortie||'En cours'}</div></div>
      <div><div class="loc-detail-label">Loyer 15e</div><div class="loc-detail-val" style="color:var(--ls)">${fmt(parseFloat(loc.loyer15||0))}</div></div>
      <div><div class="loc-detail-label">Loyer 25e</div><div class="loc-detail-val" style="color:var(--ls)">${fmt(parseFloat(loc.loyer25||0))}</div></div>
    </div>
    ${(f15||f25||(loc.loyer15>0||loc.loyer25>0))?`<div class="loc-billing">
      <div class="loc-billing-title">Facturation — ${mKey}</div>
      ${billLine(15,loc.loyer15,f15)}
      ${billLine(25,loc.loyer25,f25)}
    </div>`:''}
    ${loc.notes?`<div style="font-size:11px;color:var(--muted);margin-bottom:10px;font-style:italic">📝 ${loc.notes}</div>`:''}
    <div class="loc-actions">
      <button class="loc-action-btn" style="color:var(--rd);border-color:var(--rd);background:var(--rd-bg)" onclick="sortir('${loc.id}')">Départ</button>
      <button class="loc-action-btn" style="color:var(--muted);border-color:var(--border);background:var(--surface2)" onclick="delLoc('${loc.id}')">Supprimer</button>
    </div>
  </div>`;
}

function addLocataire(){
  const nom=document.getElementById("ls-nom").value.trim();
  const site=document.getElementById("ls-site").value.trim();
  const l15=parseFloat(document.getElementById("ls-l15").value)||0;
  const l25=parseFloat(document.getElementById("ls-l25").value)||0;
  const ent=document.getElementById("ls-entree").value;
  const notes=document.getElementById("ls-notes").value.trim();
  if(!nom){notify("Nom requis","error");return;}
  if(l15===0&&l25===0){notify("Au moins un loyer requis","error");return;}
  lsData.locataires.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),nom,site,loyer15:l15,loyer25:l25,dateEntree:ent,dateSortie:'',actif:true,notes});
  lsAddMode=false;updateBadges();render();
  notify(`Locataire "${nom}" ajouté`,"success");
}

function sortir(id){
  const loc=lsData.locataires.find(l=>l.id===id);if(!loc)return;
  const d=prompt(`Date de sortie de ${loc.nom} :`,todayStr());if(d===null)return;
  loc.actif=false;loc.dateSortie=d;updateBadges();render();
  notify(`${loc.nom} — départ enregistré`,"success");
}

function reactiver(id){
  const loc=lsData.locataires.find(l=>l.id===id);if(!loc)return;
  loc.actif=true;loc.dateSortie='';updateBadges();render();
  notify(`${loc.nom} réactivé`,"success");
}

function delLoc(id){
  const loc=lsData.locataires.find(l=>l.id===id);
  if(!loc||!confirm(`Supprimer ${loc.nom} définitivement ?`))return;
  lsData.locataires=lsData.locataires.filter(l=>l.id!==id);
  delete lsData.factures[id];updateBadges();render();
  notify("Locataire supprimé","success");
}

function genererMois(){
  const mKey=lsMonthKey;
  const actifs=lsData.locataires.filter(l=>l.actif);
  let nb=0;
  actifs.forEach(loc=>{
    if(!lsData.factures[loc.id])lsData.factures[loc.id]={};
    if(!lsData.factures[loc.id][mKey])lsData.factures[loc.id][mKey]=[];
    const ex=lsData.factures[loc.id][mKey];
    if(parseFloat(loc.loyer15||0)>0&&!ex.find(f=>f.echeance===15)){ex.push({echeance:15,montant:parseFloat(loc.loyer15),statut:"pending",dateEncaissement:null});nb++;}
    if(parseFloat(loc.loyer25||0)>0&&!ex.find(f=>f.echeance===25)){ex.push({echeance:25,montant:parseFloat(loc.loyer25),statut:"pending",dateEncaissement:null});nb++;}
  });
  render();notify(`${nb} facture(s) générée(s)`,"success");
}

function encaisser(locId,mKey,echeance){
  const facs=(lsData.factures[locId]||{})[mKey]||[];
  const fac=facs.find(f=>f.echeance===echeance);if(!fac)return;
  fac.statut='received';fac.dateEncaissement=todayStr();
  const mIdx=parseInt(mKey.split('-')[1]);
  const loc=lsData.locataires.find(l=>l.id===locId);
  if(loc){
    if(!data[mIdx]['LS'])data[mIdx]['LS']=[];
    data[mIdx]['LS'].push({
      id:Date.now().toString(36),
      date:mKey+'-'+String(echeance).padStart(2,'0'),
      libelle:`Loyer LS — ${loc.nom}${loc.site?' ('+loc.site+')':''} — échéance ${echeance}`,
      type:'E',montant:fac.montant,ordre:Date.now(),origine:'Manuel',chantierRef:''
    });
    updateBadges();
  }
  render();notify(`Encaissé — ${loc?loc.nom:''} +${fmt(fac.montant)}`,"success");
}

function getPending(mKey){
  const r=[];
  lsData.locataires.filter(l=>l.actif).forEach(loc=>{
    ((lsData.factures[loc.id]||{})[mKey]||[]).filter(f=>f.statut==='pending').forEach(f=>{
      r.push({nom:loc.nom,echeance:f.echeance,montant:f.montant});
    });
  });
  return r;
}

function fmtISOLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getWeeksOfMonth(m){
  const year=2026;
  const firstDay=new Date(year,m-1,1);
  const lastDay=new Date(year,m,0);
  let d=new Date(firstDay);
  const dow=(d.getDay()+6)%7; // 0=lundi
  d.setDate(d.getDate()-dow);
  const weeks=[];
  while(d<=lastDay){
    const weekStart=new Date(d);
    const weekEnd=new Date(d);weekEnd.setDate(weekEnd.getDate()+6);
    weeks.push({start:weekStart,end:weekEnd,startStr:fmtISOLocal(weekStart),endStr:fmtISOLocal(weekEnd)});
    d.setDate(d.getDate()+7);
  }
  return weeks;
}

function computeMonthOps(m){
  // Liste complète du mois (toutes prestations), triée chronologiquement, avec solde cumulé + TVA
  let all=[];
  SERVICES.forEach(s=>(data[m][s.code]||[]).forEach(op=>all.push({...op,service:s.code,ordre:op.ordre||0})));
  all.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ordre-b.ordre));
  let running=0;
  all.forEach(o=>{
    running+=(o.type==='E'?o.montant:-o.montant);
    o.solde=running;
    if(o.taux==='libre'){
      o.montantTVA=parseFloat(o.montantTVAManuel||0);
      o.montantHT=o.montant-o.montantTVA;
    } else {
      const taux=(o.taux===0||o.taux)?o.taux:20;
      o.taux=taux;
      o.montantHT=taux>0?o.montant/(1+taux/100):o.montant;
      o.montantTVA=o.montant-o.montantHT;
    }
  });
  return all;
}
function getOps(m){
  let ops=computeMonthOps(m);
  if(currentSvc!=="ALL")ops=ops.filter(o=>o.service===currentSvc);
  return ops;
}
function addOp(m){
  const date=document.getElementById("f-date").value;
  const lib=document.getElementById("f-lib").value.trim();
  const svc=document.getElementById("f-svc").value;
  const amt=parseFloat(document.getElementById("f-amt").value);
  const tauxRaw=document.getElementById("f-tva").value;
  const taux=(tauxRaw==='libre')?'libre':parseFloat(tauxRaw);
  const montantTVAManuel=(tauxRaw==='libre')?parseFloat(document.getElementById('f-tva-libre').value)||0:0;
  const benefEl=document.getElementById("f-benef");
  const beneficiaire=(benefEl && benefEl.value!=='__new__')?benefEl.value:'';
  if(!lib){notify("Libellé requis","error");return;}
  if(!amt||amt<=0){notify("Montant invalide","error");return;}
  if(taux==='libre' && montantTVAManuel<=0){notify("Montant de TVA requis pour la saisie libre","error");return;}
  if(!data[m][svc])data[m][svc]=[];
  data[m][svc].push({id:Date.now().toString(36),date,libelle:lib,type:formType,montant:amt,taux,montantTVAManuel,beneficiaire,ordre:Date.now(),origine:'Manuel',chantierRef:''});
  document.getElementById("f-lib").value="";document.getElementById("f-amt").value="";
  updateBadges();render();
  notify(`${svc} — ${formType==='E'?'Entrée':'Sortie'} ${fmt(amt)}`,"success");
}
function delOp(m,svc,id){data[m][svc]=(data[m][svc]||[]).filter(o=>o.id!==id);updateBadges();render();}

// DÉPLACEMENT DES OPÉRATIONS (édition date + drag&drop)
// ══════════════════════════════════════════════
let dragOp=null; // {m,svc,id}

function findOp(m,svc,id){
  const arr=data[m]&&data[m][svc]||[];
  return arr.find(o=>o.id===id);
}

// -- Modifier la date directement (change de mois si besoin) --
function updateOpDate(m,svc,id,newDate){
  if(!newDate)return;
  const op=findOp(m,svc,id);if(!op)return;
  const newMonth=parseInt(newDate.split('-')[1],10);
  op.date=newDate;
  if(newMonth!==m){
    data[m][svc]=data[m][svc].filter(o=>o.id!==id);
    if(!data[newMonth][svc])data[newMonth][svc]=[];
    data[newMonth][svc].push(op);
    updateBadges();render();
    notify(`Déplacé vers ${MONTHS[newMonth-1]} — ${op.libelle}`,"success");
  } else {
    updateBadges();render();
  }
}
function updateOpTaux(m,svc,id,newTaux){
  const op=findOp(m,svc,id);if(!op)return;
  if(newTaux==='libre'){
    const val=prompt(`Montant de TVA (€) pour "${op.libelle}" :`, op.montantTVAManuel||'');
    if(val===null)return; // annulé, on ne change rien
    const parsed=parseFloat(val);
    if(!parsed||parsed<0){notify('Montant de TVA invalide','error');return;}
    op.taux='libre';
    op.montantTVAManuel=parsed;
  } else {
    op.taux=parseFloat(newTaux);
  }
  updateBadges();render();
}

// -- Glisser-déposer entre lignes (réordonner à date égale / changer l'échéance visuellement) --
function opDragStart(ev,m,svc,id){
  dragOp={m,svc,id};
  ev.currentTarget.classList.add('dragging');
  ev.dataTransfer.effectAllowed='move';
  ev.dataTransfer.setData('text/plain',id);
}
function opDragEnd(ev){ev.currentTarget.classList.remove('dragging');}
function opRowDragOver(ev){ev.preventDefault();ev.currentTarget.classList.add('drag-over');}
function opRowDragLeave(ev){ev.currentTarget.classList.remove('drag-over');}
function opRowDrop(ev,m,svc,targetId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over');
  if(!dragOp)return;
  const dragged=findOp(dragOp.m,dragOp.svc,dragOp.id);
  const target=findOp(m,svc,targetId);
  if(!dragged||!target||dragged.id===target.id){dragOp=null;return;}
  const movedAcrossMonth=dragOp.m!==m;
  dragged.date=target.date;
  dragged.ordre=(target.ordre||0)-1;
  if(movedAcrossMonth){
    data[dragOp.m][dragOp.svc]=data[dragOp.m][dragOp.svc].filter(o=>o.id!==dragged.id);
    if(!data[m][dragOp.svc])data[m][dragOp.svc]=[];
    data[m][dragOp.svc].push(dragged);
  }
  dragOp=null;updateBadges();render();
  notify(`Échéance déplacée au ${target.date}`,"success");
}

// -- Glisser une ligne directement sur un mois de la sidebar --
function monthDragOver(ev){ev.preventDefault();ev.currentTarget.classList.add('drag-target');}
function monthDragLeave(ev){ev.currentTarget.classList.remove('drag-target');}
function monthDrop(ev,targetMonth){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-target');
  if(!dragOp)return;
  const op=findOp(dragOp.m,dragOp.svc,dragOp.id);
  if(!op){dragOp=null;return;}
  if(targetMonth===dragOp.m){dragOp=null;return;}
  const day=(op.date||'').split('-')[2]||'01';
  op.date=`2026-${String(targetMonth).padStart(2,'0')}-${day}`;
  data[dragOp.m][dragOp.svc]=data[dragOp.m][dragOp.svc].filter(o=>o.id!==op.id);
  if(!data[targetMonth][dragOp.svc])data[targetMonth][dragOp.svc]=[];
  data[targetMonth][dragOp.svc].push(op);
  dragOp=null;updateBadges();render();
  notify(`Déplacé vers ${MONTHS[targetMonth-1]} — ${op.libelle}`,"success");
}
function filterSvc(svc){currentSvc=svc;render();}
function setType(t){formType=t;render();}

function chargesTable(charges, type){
  const now=new Date();
  const moisActuel=now.getMonth()+1;
  const trimActuel=Math.ceil(moisActuel/3);

  let html=`<table><thead><tr>
    <th></th><th>Intitulé</th><th>Organisme</th><th>Montant</th>
    <th>Prochaine échéance</th><th>Statut ce mois/trim</th><th>Notes</th><th></th>
  </tr></thead><tbody>`;

  charges.forEach(c=>{
    const moisKey=`2026-${String(moisActuel).padStart(2,'0')}`;
    const hist=c.historique||[];
    const payeCeMois=hist.find(h=>h.mois===moisKey);
    const payeCeTrim=type==='trimestrielle'?hist.find(h=>{
      const hm=parseInt((h.mois||'').split('-')[1]||0);
      return Math.ceil(hm/3)===trimActuel && (h.mois||'').startsWith('2026');
    }):null;
    const estPaye=type==='mensuelle'?payeCeMois:(type==='trimestrielle'?payeCeTrim:hist.length>0);

    const prochaineEch=type==='mensuelle'?`Mois ${moisActuel}`:
      type==='trimestrielle'?`T${trimActuel} (mois ${trimActuel*3-2}-${trimActuel*3})`:
      'Annuelle';
    const flux=c.flux||'D';
    const montantColor=flux==='E'?'var(--income)':'var(--fg)';

    html+=`<tr>
      <td title="${flux==='E'?'Recette récurrente':'Charge / dépense'}">${flux==='E'?'↑':'↓'} <span style="font-size:10px;color:var(--muted)">${c.service||'FG'}</span></td>
      <td style="font-weight:700">${c.nom}</td>
      <td style="color:var(--muted)">${c.organisme||'—'}</td>
      <td style="font-family:'DM Mono',monospace;font-weight:700;color:${montantColor}">${fmt(parseFloat(c.montant||0))}</td>
      <td style="font-size:12px;color:var(--muted)">${prochaineEch}</td>
      <td>${estPaye
        ?`<span style="background:#0D2D1E;color:var(--income);font-size:10px;font-weight:700;padding:3px 10px;border-radius:4px">✓ ${flux==='E'?'Encaissé':'Payé'}</span>`
        :`<button style="background:#2D2200;color:var(--lm);font-size:10px;font-weight:700;padding:3px 10px;border-radius:4px;border:none;cursor:pointer;font-family:'Syne',sans-serif;transition:all .15s"
          onmouseover="this.style.background='var(--lm)';this.style.color='#000'"
          onmouseout="this.style.background='#2D2200';this.style.color='var(--lm)'"
          onclick="payerCharge('${c.id}')">Marquer ${flux==='E'?'encaissé':'payé'}</button>`
      }</td>
      <td style="font-size:11px;color:var(--muted);font-style:italic">${c.notes||''}</td>
      <td><button class="btn-danger-sm" title="Supprimer définitivement de la liste récurrente" onclick="delCharge('${c.id}')">✕</button></td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  return html;
}

function projectionPanel(mensuel, trimestriel, annuel, dettes){
  const mensualitesDettes=dettes.reduce((s,d)=>s+parseFloat(d.mensualite||0),0);
  const chargesMois=mensuel+Math.round(trimestriel/3*100)/100+Math.round(annuel/12*100)/100;
  const totalMois=chargesMois+mensualitesDettes;
  const MOIS_FR=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
  const now=new Date().getMonth();

  const bars=MOIS_FR.map((mn,i)=>{
    const trimCharge=(i+1)%3===0?trimestriel:0; // simplification : fin de trimestre
    const annCharge=i===11?annuel:0;
    const total=mensuel+trimCharge+annCharge+mensualitesDettes;
    return{mn,total,isCurrentOrFuture:i>=now};
  });
  const maxVal=Math.max(...bars.map(b=>b.total),1);

  let html=`<div class="dc-section">
    <div class="dc-section-hdr">
      <span class="dc-section-title">Projection mensuelle des charges</span>
      <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">Charge moy. : ${fmt(totalMois)} / mois</span>
    </div>
    <div style="padding:16px">
      <div style="display:flex;align-items:flex-end;gap:6px;height:100px">`;
  bars.forEach(b=>{
    const h=Math.max(4,Math.round(b.total/maxVal*88));
    html+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="width:100%;height:${h}px;background:${b.isCurrentOrFuture?'var(--rd)':'var(--surface3)'};border-radius:3px 3px 0 0;opacity:${b.isCurrentOrFuture?'1':'0.5'}"></div>
      <span style="font-size:9px;color:var(--muted)">${b.mn}</span>
    </div>`;
  });
  html+=`</div>
      <div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;font-size:12px">
        <span style="color:var(--muted)">Charges fixes : <strong style="color:var(--fg)">${fmt(chargesMois)}</strong></span>
        <span style="color:var(--muted)">Mensualités dettes : <strong style="color:var(--rd)">${fmt(mensualitesDettes)}</strong></span>
        <span style="color:var(--muted)">Total mensuel moyen : <strong style="color:var(--text)">${fmt(totalMois)}</strong></span>
      </div>
    </div>
  </div>`;
  return html;
}

function addDette(){
  const nom=document.getElementById("dc-dnom").value.trim();

  const tot=parseFloat(document.getElementById("dc-dtot").value)||0;
  const pay=parseFloat(document.getElementById("dc-dpay").value)||0;
  const mens=parseFloat(document.getElementById("dc-dmens").value)||0;
  const date=document.getElementById("dc-ddate").value;
  const notes=document.getElementById("dc-dnotes").value.trim();
  if(!nom){notify("Intitulé requis","error");return;}
  if(tot<=0){notify("Montant total requis","error");return;}
  dcData.dettes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),nom,credancier:cred,montantTotal:tot,montantPaye:pay,mensualite:mens,dateDebut:date,notes});

}

function setDcChargeFlux(f){dcChargeFlux=f;render();}
function addCharge(){
  const nom=document.getElementById("dc-cnom").value.trim();

  const svc=document.getElementById("dc-csvc").value;

function payerMensualite(id){
  const d=dcData.dettes.find(x=>x.id===id);if(!d)return;
  const mens=parseFloat(d.mensualite||0);
  if(mens<=0){notify("Pas de mensualité définie","error");return;}
  d.montantPaye=parseFloat(d.montantPaye||0)+mens;
  // Injecter dans opérations du mois courant
  const m=new Date().getMonth()+1;
  if(!data[m]['RD'])data[m]['RD']=[];
  data[m]['RD'].push({id:Date.now().toString(36),date:todayStr(),libelle:`Remb. dette — ${d.nom} (${d.credancier||''})`,type:'D',montant:mens});
  updateBadges();render();
  notify(`Mensualité ${fmt(mens)} enregistrée pour ${d.nom}`,"success");
}

function payerCharge(id){
  const c=dcData.charges.find(x=>x.id===id);if(!c)return;
  const moisKey=`2026-${String(new Date().getMonth()+1).padStart(2,'0')}`;
  if(!c.historique)c.historique=[];
  c.historique.push({mois:moisKey,paye:parseFloat(c.montant||0),date:todayStr()});
  const flux=c.flux||'D';
  const svc=c.service||'FG';
  // Injecter dans opérations
  const m=new Date().getMonth()+1;
  if(!data[m][svc])data[m][svc]=[];
  data[m][svc].push({id:Date.now().toString(36),date:todayStr(),
    libelle:`${flux==='E'?'Recette récurrente':'Charge'} — ${c.nom} (${c.organisme||''})`,
    type:flux,montant:parseFloat(c.montant||0),taux:20,ordre:Date.now(),origine:'Recurrent',chantierRef:''});
  updateBadges();render();
  notify(`${c.nom} — ${fmt(parseFloat(c.montant||0))} enregistré`,"success");
}

function delDette(id){
  if(!confirm("Supprimer cette dette ?"))return;
  dcData.dettes=dcData.dettes.filter(d=>d.id!==id);updateBadges();render();
  notify("Dette supprimée","success");
}

function delCharge(id){
  if(!confirm("Supprimer cette charge ?"))return;
  dcData.charges=dcData.charges.filter(c=>c.id!==id);updateBadges();render();
  notify("Charge supprimée","success");
}

async function saveHistorique(){
  let count=0;
  document.querySelectorAll('.hist-input').forEach(inp=>{
    const m=parseInt(inp.dataset.m,10), svc=inp.dataset.svc, type=inp.dataset.type;
    const id='hist_'+m+'_'+svc+'_'+type;
    const val=parseFloat(inp.value);
    if(!data[m][svc])data[m][svc]=[];
    const idx=data[m][svc].findIndex(o=>o.id===id);
    if(val>0){
      const opData={id,date:`2026-${String(m).padStart(2,'0')}-01`,
        libelle:`Historique ${type==='E'?'entrées':'sorties'} — ${svc}`,
        type,montant:val,ordre:0,origine:'Historique',chantierRef:''};
      if(idx>=0)data[m][svc][idx]=opData; else data[m][svc].push(opData);
      count++;
    } else if(idx>=0){
      data[m][svc].splice(idx,1);
    }
  });
  updateBadges();render();
  if(airtableState.token && airtableState.base){
    notify(`Historique enregistré (${count} ligne(s)) — sauvegarde Airtable en cours...`,"success");
    await airtableSaveAll();
  } else {
    notify(`Historique enregistré localement (${count} ligne(s)) — ⚠️ configure Airtable pour ne pas le perdre au rechargement`,"error");
  }
}

let margeMonth = (new Date().getFullYear()===2026) ? (new Date().getMonth()+1) : 1;
let margeViewMode = 'mois'; // 'mois' | 'annuel'
let margeCache = {chantiers:null, avoirs:null, loading:false};

async function loadMargeData(){
  if(!airtableState.token||!airtableState.base){notify('Configure Airtable d\'abord (⚙ Airtable)','error');return;}
  margeCache.loading=true;render();
  try{
    margeCache.chantiers = await atGetAll(AT_TABLES.chantiers);
    margeCache.avoirs = await atGetAll(AT_TABLES.avoirs);
    notify('Données chantiers/avoirs actualisées','success');
  }catch(e){
    notify('Erreur chargement : '+e.message,'error');
  }
  margeCache.loading=false;render();
}

function svcOfChantier(f){
  return (f.Region||'').toUpperCase().includes('LMPM') ? 'LMPM' : 'PRGO';
}

function computeMargeMonth(m, chantiers, avoirs){
  const res={PRGO:{fact:0,cout:0,avoir:0},LMPM:{fact:0,cout:0,avoir:0}};
  (chantiers||[]).forEach(r=>{
    const f=r.fields;
    if(!f.DateFacture||!f.MontantFacture)return;
    const mm=parseInt((f.DateFacture+'').split('-')[1],10);
    if(mm!==m)return;
    const svc=svcOfChantier(f);
    res[svc].fact+=parseFloat(f.MontantFacture||0);
    res[svc].cout+=parseFloat(f.CoutMateriel||0)+parseFloat(f.CoutMainOeuvre||0);
  });
  (avoirs||[]).forEach(r=>{
    const f=r.fields;
    if(!f.Date)return;
    const mm=parseInt((f.Date+'').split('-')[1],10);
    if(mm!==m)return;
    if(res[f.Service]) res[f.Service].avoir+=parseFloat(f.Montant||0);
  });
  const margePRGO=res.PRGO.fact-res.PRGO.cout-res.PRGO.avoir;
  const margeLMPM=res.LMPM.fact-res.LMPM.cout-res.LMPM.avoir;
  const caPRGO=res.PRGO.fact-res.PRGO.avoir;
  const caLMPM=res.LMPM.fact-res.LMPM.avoir;
  return {margePRGO,margeLMPM,margeTotal:margePRGO+margeLMPM,ca:caPRGO+caLMPM,detail:res};
}

function netFlow(m,svc){
  let e=0,d=0;
  (data[m][svc]||[]).forEach(o=>{if(o.type==='E')e+=o.montant;else d+=o.montant;});
  return {e,d,net:d-e};
}

    ${margeViewMode==='mois'?`

    <select onchange="margeMonth=parseInt(this.value,10);render()"
      style="background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:6px 10px;border-radius:var(--radius);outline:none">
      ${MONTHS.map((mn,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${mn} 2026</option>`).join('')}
    </select>`:''}
    <button class="btn btn-ghost" onclick="loadMargeData()">${margeCache.loading?'<span class="sync-spinner"></span> Chargement...':'🔄 Actualiser depuis Airtable'}</button>
  </div>`;

  if(!margeCache.chantiers){
    h+=`<div class="empty-state"><div class="empty-icon">📊</div>Clique "🔄 Actualiser depuis Airtable" pour charger les chantiers et avoirs.</div>`;
    document.getElementById("page-content").innerHTML=h;
    return;
  }

  h += (margeViewMode==='annuel') ? renderMargeAnnuelBody() : renderMargeMoisBody(m);
  document.getElementById("page-content").innerHTML=h;
}

function renderMargeMoisBody(m){
  const mg=computeMargeMonth(m, margeCache.chantiers, margeCache.avoirs);
  const fg=netFlow(m,'FG').net;
  const rd=netFlow(m,'RD').net;
  const resultatOp=mg.margeTotal-fg;
  const capaciteRemb=resultatOp-rd;

  let margeSum=0,caSum=0;
  for(let k=0;k<3;k++){
    const mm=m-k;if(mm<1)continue;
    const mgk=computeMargeMonth(mm, margeCache.chantiers, margeCache.avoirs);
    margeSum+=mgk.margeTotal;caSum+=mgk.ca;
  }
  const tauxMoyen=caSum>0?(margeSum/caSum):null;
  const caNecessaire=(tauxMoyen&&tauxMoyen>0)?((fg+rd)/tauxMoyen):null;

  return `<div class="section-title">Performance opérationnelle — ${MONTHS[m-1]}</div>
  <div class="totals-grid">
    <div class="svc-total-card" style="border-color:var(--prgo)">
      <div class="svc-total-name" style="color:var(--prgo)">PRGO</div>
      <div class="svc-total-row"><span>Facturation</span><span>${fmt(mg.detail.PRGO.fact)}</span></div>
      <div class="svc-total-row"><span>Coûts directs</span><span>${fmt(mg.detail.PRGO.cout)}</span></div>
      <div class="svc-total-row"><span>Avoirs</span><span>${fmt(mg.detail.PRGO.avoir)}</span></div>
      <div class="svc-total-net"><span>Marge brute</span><span style="color:${mg.margePRGO>=0?'var(--income)':'var(--expense)'}">${fmt(mg.margePRGO)}</span></div>
    </div>
    <div class="svc-total-card" style="border-color:var(--lmpm)">
      <div class="svc-total-name" style="color:var(--lmpm)">LMPM</div>
      <div class="svc-total-row"><span>Facturation</span><span>${fmt(mg.detail.LMPM.fact)}</span></div>
      <div class="svc-total-row"><span>Coûts directs</span><span>${fmt(mg.detail.LMPM.cout)}</span></div>
      <div class="svc-total-row"><span>Avoirs</span><span>${fmt(mg.detail.LMPM.avoir)}</span></div>
      <div class="svc-total-net"><span>Marge brute</span><span style="color:${mg.margeLMPM>=0?'var(--income)':'var(--expense)'}">${fmt(mg.margeLMPM)}</span></div>
    </div>
  </div>
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-label">Marge brute totale</div><div class="stat-value ${mg.margeTotal>=0?'positive':'negative'}">${fmt(mg.margeTotal)}</div></div>
    <div class="stat-card"><div class="stat-label">Frais généraux (FG)</div><div class="stat-value negative">${fmt(fg)}</div></div>
    <div class="stat-card"><div class="stat-label">Résultat opérationnel</div><div class="stat-value ${resultatOp>=0?'positive':'negative'}">${fmt(resultatOp)}</div></div>
  </div>

  <div class="section-title">Servitude — dettes antérieures</div>
  <div class="dc-banner" style="background:linear-gradient(135deg,#241535,#0D2040);border-color:var(--lmpm)">
    <div class="ls-banner-item"><span class="ls-banner-label">Remboursement dettes (RD)</span><span class="dc-banner-val" style="color:var(--lmpm)">${fmt(rd)}</span></div>
    <div class="ls-banner-item"><span class="ls-banner-label">Capacité de remboursement</span><span class="dc-banner-val" style="color:${capaciteRemb>=0?'var(--income)':'var(--rd)'}">${fmt(capaciteRemb)}</span></div>
    <div class="ls-banner-item"><span class="ls-banner-label">Taux de marge moyen (3 mois)</span><span class="dc-banner-val" style="color:var(--muted)">${tauxMoyen!==null?(tauxMoyen*100).toFixed(1)+' %':'—'}</span></div>
    <div class="ls-banner-item"><span class="ls-banner-label">CA nécessaire (FG + RD couverts)</span><span class="dc-banner-val" style="color:var(--accent)">${caNecessaire!==null?fmt(caNecessaire):'Indéterminé (pas assez de données)'}</span></div>
  </div>
  <div style="font-size:11px;color:var(--muted);line-height:1.6">
    💡 Le "CA nécessaire" est le chiffre d'affaires facturé qu'il faudrait réaliser, compte tenu de ton taux de marge moyen des 3 derniers mois, pour couvrir à la fois tes frais généraux et le remboursement de dette de ce mois.
    ${capaciteRemb<0?'<br>⚠️ Ce mois, l\'activité ne couvre pas le remboursement de dette prévu — le déficit est à combler par la trésorerie disponible.':''}
  </div>`;
}

function renderMargeAnnuelBody(){
  const rows=[];
  let totMargePRGO=0,totMargeLMPM=0,totFG=0,totRD=0,totCA=0;
  for(let m=1;m<=12;m++){
    const mg=computeMargeMonth(m, margeCache.chantiers, margeCache.avoirs);
    const fg=netFlow(m,'FG').net;
    const rd=netFlow(m,'RD').net;
    const resultatOp=mg.margeTotal-fg;
    const capaciteRemb=resultatOp-rd;
    totMargePRGO+=mg.margePRGO;totMargeLMPM+=mg.margeLMPM;totFG+=fg;totRD+=rd;totCA+=mg.ca;
    rows.push({m,mg,fg,rd,resultatOp,capaciteRemb});
  }
  const margeTotaleAn=totMargePRGO+totMargeLMPM;
  const resultatOpAn=margeTotaleAn-totFG;
  const capaciteRembAn=resultatOpAn-totRD;
  const tauxAnnuel=totCA>0?(margeTotaleAn/totCA):null;
  const caNecessaireAn=(tauxAnnuel&&tauxAnnuel>0)?((totFG+totRD)/tauxAnnuel):null;

  return `<div class="section-title">Synthèse annuelle 2026</div>
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-label">Marge brute annuelle</div><div class="stat-value ${margeTotaleAn>=0?'positive':'negative'}">${fmt(margeTotaleAn)}</div></div>
    <div class="stat-card"><div class="stat-label">Frais généraux annuels</div><div class="stat-value negative">${fmt(totFG)}</div></div>
    <div class="stat-card"><div class="stat-label">Résultat opérationnel annuel</div><div class="stat-value ${resultatOpAn>=0?'positive':'negative'}">${fmt(resultatOpAn)}</div></div>
  </div>
  <div class="dc-banner" style="background:linear-gradient(135deg,#241535,#0D2040);border-color:var(--lmpm)">
    <div class="ls-banner-item"><span class="ls-banner-label">Remboursement dettes (année)</span><span class="dc-banner-val" style="color:var(--lmpm)">${fmt(totRD)}</span></div>
    <div class="ls-banner-item"><span class="ls-banner-label">Capacité de remboursement annuelle</span><span class="dc-banner-val" style="color:${capaciteRembAn>=0?'var(--income)':'var(--rd)'}">${fmt(capaciteRembAn)}</span></div>
    <div class="ls-banner-item"><span class="ls-banner-label">Taux de marge annuel</span><span class="dc-banner-val" style="color:var(--muted)">${tauxAnnuel!==null?(tauxAnnuel*100).toFixed(1)+' %':'—'}</span></div>
    <div class="ls-banner-item"><span class="ls-banner-label">CA nécessaire (année)</span><span class="dc-banner-val" style="color:var(--accent)">${caNecessaireAn!==null?fmt(caNecessaireAn):'Indéterminé'}</span></div>
  </div>

  <div class="section-title">Par mois</div>
  <div class="table-wrap"><table><thead><tr>
    <th>Mois</th>
    <th style="text-align:right;color:var(--prgo)">Marge PRGO</th>
    <th style="text-align:right;color:var(--lmpm)">Marge LMPM</th>
    <th style="text-align:right">Marge totale</th>
    <th style="text-align:right;color:var(--fg)">FG</th>
    <th style="text-align:right">Résultat op.</th>
    <th style="text-align:right;color:var(--lmpm)">RD</th>
    <th style="text-align:right">Capacité remb.</th>
  </tr></thead>
  <tbody>${rows.map(r=>`<tr>
    <td style="font-weight:700">${MONTHS[r.m-1]}</td>
    <td class="td-amount ${r.mg.margePRGO>=0?'e':'d'}">${fmt(r.mg.margePRGO)}</td>
    <td class="td-amount ${r.mg.margeLMPM>=0?'e':'d'}">${fmt(r.mg.margeLMPM)}</td>
    <td class="td-amount ${r.mg.margeTotal>=0?'e':'d'}">${fmt(r.mg.margeTotal)}</td>
    <td class="td-amount d">${fmt(r.fg)}</td>
    <td class="td-amount ${r.resultatOp>=0?'e':'d'}">${fmt(r.resultatOp)}</td>
    <td class="td-amount d">${fmt(r.rd)}</td>
    <td class="td-amount ${r.capaciteRemb>=0?'e':'d'}">${fmt(r.capaciteRemb)}</td>
  </tr>`).join('')}</tbody></table></div>`;
}

function submitFactureFournisseur(){
  const lib=document.getElementById('ff-lib').value.trim();

  const svc=document.getElementById('ff-svc').value;
  const tauxRaw=document.getElementById('ff-tva').value;
  const taux=(tauxRaw==='libre')?'libre':parseFloat(tauxRaw);
  const montantTVAManuel=(tauxRaw==='libre')?parseFloat(document.getElementById('ff-tva-libre').value)||0:0;
  const beneficiaire=document.getElementById('ff-benef').value;
  const recurrent=document.getElementById('ff-recurrent').checked;
  if(!lib){notify('Libellé requis','error');return;}
  if(!date){notify('Date requise','error');return;}

  if(taux==='libre' && montantTVAManuel<=0){notify('Montant de TVA requis pour la saisie libre','error');return;}

  if(!data[m][svc])data[m][svc]=[];

  if(recurrent){

  const p=document.getElementById('facture-panel');if(p)p.remove();
  updateBadges();render();
  notify(recurrent
    ?`Facture enregistrée dans ${MONTHS[m-1]} — ${svc} — ${fmt(amt)} — ajoutée aux récurrences de Dettes & Charges`
    :`Facture enregistrée dans ${MONTHS[m-1]} — ${svc} — ${fmt(amt)}`,'success');
}

// -- Helpers REST génériques --
async function atGetAll(table){
  let records=[],offset;
  do{
    const url=`https://api.airtable.com/v0/${airtableState.base}/${encodeURIComponent(table)}${offset?'?offset='+offset:''}`;
    const res=await fetch(url,{headers:{Authorization:'Bearer '+airtableState.token}});
    if(!res.ok) throw new Error(table+' (lecture) : HTTP '+res.status);
    const j=await res.json();
    records=records.concat(j.records||[]);
    offset=j.offset;
  }while(offset);
  return records;
}
async function atDeleteAll(table, ids){
  for(let i=0;i<ids.length;i+=10){
    const chunk=ids.slice(i,i+10);
    const qs=chunk.map(id=>'records[]='+encodeURIComponent(id)).join('&');
    const res=await fetch(`https://api.airtable.com/v0/${airtableState.base}/${encodeURIComponent(table)}?${qs}`,
      {method:'DELETE',headers:{Authorization:'Bearer '+airtableState.token}});
    if(!res.ok) throw new Error(table+' (suppression) : HTTP '+res.status);
  }
}
async function atCreateAll(table, fieldsArray){
  const created=[];
  for(let i=0;i<fieldsArray.length;i+=10){
    const chunk=fieldsArray.slice(i,i+10).map(f=>({fields:f}));
    const res=await fetch(`https://api.airtable.com/v0/${airtableState.base}/${encodeURIComponent(table)}`,
      {method:'POST',headers:{Authorization:'Bearer '+airtableState.token,'Content-Type':'application/json'},
       body:JSON.stringify({records:chunk, typecast:true})});
    if(!res.ok) throw new Error(table+' (écriture) : HTTP '+res.status);
    const j=await res.json();
    created.push(...(j.records||[]));
  }
  return created;
}

// -- Chargement complet depuis Airtable --
async function airtableLoadAll(){
  if(!airtableState.token||!airtableState.base){atSetStatus('idle','Airtable non configuré');return;}
  if(airtableState.syncing)return;
  airtableState.syncing=true;
  atSetStatus('warn','Chargement depuis Airtable...');
  try{
    for(let m=1;m<=12;m++){data[m]={};SERVICES.forEach(s=>data[m][s.code]=[]);}

    const mouv=await atGetAll(AT_TABLES.mouvements);
    mouv.forEach(r=>{
      const f=r.fields,m=parseInt(f.Mois,10),svc=f.Service;
      if(!m||!svc||!data[m]||!data[m][svc])return;
      data[m][svc].push({id:r.id,date:f.Date||'',libelle:f.Libelle||'',type:f.Type||'E',
        montant:parseFloat(f.Montant||0),
        taux:(f.Taux==='libre')?'libre':((f.Taux===0||f.Taux)?parseFloat(f.Taux):20),
        montantTVAManuel:parseFloat(f.MontantTVAManuel||0),
        beneficiaire:f.Beneficiaire||'',ordre:0,origine:f.Origine||'Manuel',chantierRef:f.ChantierRef||''});
    });

    lsData.locataires=[];
    const locs=await atGetAll(AT_TABLES.locataires);
    locs.forEach(r=>{
      const f=r.fields;
      lsData.locataires.push({id:f.LocalId||r.id,nom:f.Nom||'',site:f.Site||'',
        loyer15:parseFloat(f.Loyer15||0),loyer25:parseFloat(f.Loyer25||0),
        dateEntree:f.DateEntree||'',dateSortie:f.DateSortie||'',actif:!!f.Actif,notes:f.Notes||''});
    });

    lsData.factures={};
    const facs=await atGetAll(AT_TABLES.factures);
    facs.forEach(r=>{
      const f=r.fields,locId=f.LocataireId;if(!locId)return;
      if(!lsData.factures[locId])lsData.factures[locId]={};
      if(!lsData.factures[locId][f.MoisKey])lsData.factures[locId][f.MoisKey]=[];
      lsData.factures[locId][f.MoisKey].push({echeance:parseInt(f.Echeance,10),
        montant:parseFloat(f.Montant||0),statut:f.Statut||'pending',dateEncaissement:f.DateEncaissement||null});
    });

    dcData.dettes=[];
    const dets=await atGetAll(AT_TABLES.dettes);
    dets.forEach(r=>{
      const f=r.fields;
      dcData.dettes.push({id:r.id,nom:f.Nom||'',credancier:f.Creancier||'',
        montantTotal:parseFloat(f.MontantTotal||0),montantPaye:parseFloat(f.MontantPaye||0),
        mensualite:parseFloat(f.Mensualite||0),dateDebut:f.DateDebut||'',notes:f.Notes||''});
    });

    dcData.charges=[];
    const chgs=await atGetAll(AT_TABLES.charges);
    chgs.forEach(r=>{
      const f=r.fields;let hist=[];
      try{hist=JSON.parse(f.Historique||'[]');}catch(e){hist=[];}
      dcData.charges.push({id:r.id,nom:f.Nom||'',type:f.Type||'mensuelle',
        montant:parseFloat(f.Montant||0),organisme:f.Organisme||'',notes:f.Notes||'',
        flux:f.Flux||'D',service:f.Service||'FG',historique:hist});
    });

    const collabRecords=await atGetAll(AT_TABLES.collaborateurs);
    if(collabRecords.length>0){
      collaborateurs=collabRecords.map(r=>r.fields.Nom).filter(Boolean);
      saveCollaborateurs();
    } else {
      // Première utilisation : on envoie la liste locale par défaut vers Airtable
      await atCreateAll(AT_TABLES.collaborateurs, collaborateurs.map(n=>({Nom:n})));
    }

    updateBadges();render();
    atSetStatus('ok','Données chargées depuis Airtable',new Date().toLocaleTimeString('fr-FR'));
    notify('Données Airtable chargées','success');
  }catch(e){
    atSetStatus('err','Erreur : '+e.message);
    notify('Erreur Airtable : '+e.message,'error');
  }
  airtableState.syncing=false;
}

// -- Sauvegarde complète vers Airtable (purge + recréation de chaque table) --
async function safeSyncTable(table, newFieldsArray){
  // Sécurité anti-perte de données, en deux temps :
  // 1) Si les données locales sont vides mais qu'Airtable contient déjà des enregistrements,
  //    on REFUSE de synchroniser (ça éviterait sinon d'écraser de vraies données si le
  //    chargement local a échoué ou est incomplet — cause probable de la remise à zéro).
  // 2) Sinon, on crée d'abord les nouvelles lignes, et on ne supprime les anciennes
  //    QUE si la création a réussi.
  const existing = await atGetAll(table);
  const existingIds = existing.map(r=>r.id);
  if(newFieldsArray.length===0 && existingIds.length>0){
    return {skipped:true, table};
  }
  if(newFieldsArray.length) await atCreateAll(table, newFieldsArray);
  if(existingIds.length) await atDeleteAll(table, existingIds);
  return {skipped:false, table};
}

async function airtableSaveAll(){
  if(!airtableState.token||!airtableState.base){notify('Configure Airtable d\'abord (⚙ Airtable)','error');return;}
  if(airtableState.syncing)return;
  airtableState.syncing=true;
  const btn=document.getElementById('btn-at-save');
  if(btn)btn.innerHTML='<span class="sync-spinner"></span> Sauvegarde...';
  atSetStatus('warn','Sauvegarde en cours...');
  const skippedTables=[];
  try{
    let mouvFields=[];
    for(let m=1;m<=12;m++)SERVICES.forEach(s=>(data[m][s.code]||[]).forEach(op=>{
      mouvFields.push({Mois:m,Service:s.code,Date:op.date||'',Libelle:op.libelle||'',
        Type:op.type,Montant:op.montant,Taux:String((op.taux===0||op.taux)?op.taux:20),
        MontantTVAManuel:parseFloat(op.montantTVAManuel||0),
        Beneficiaire:op.beneficiaire||'',Origine:op.origine||'Manuel',ChantierRef:op.chantierRef||''});
    }));
    let r=await safeSyncTable(AT_TABLES.mouvements, mouvFields);if(r.skipped)skippedTables.push('Mouvements');

    const locFields=lsData.locataires.map(l=>({LocalId:l.id,Nom:l.nom,Site:l.site||'',
      Loyer15:parseFloat(l.loyer15||0),Loyer25:parseFloat(l.loyer25||0),
      DateEntree:l.dateEntree||null,DateSortie:l.dateSortie||null,Actif:!!l.actif,Notes:l.notes||''}));
    r=await safeSyncTable(AT_TABLES.locataires, locFields);if(r.skipped)skippedTables.push('Locataires');

    let facFields=[];
    Object.keys(lsData.factures).forEach(locId=>{
      Object.keys(lsData.factures[locId]).forEach(mKey=>{
        (lsData.factures[locId][mKey]||[]).forEach(f=>{
          facFields.push({LocataireId:locId,MoisKey:mKey,Echeance:f.echeance,
            Montant:f.montant,Statut:f.statut,DateEncaissement:f.dateEncaissement||null});
        });
      });
    });
    r=await safeSyncTable(AT_TABLES.factures, facFields);if(r.skipped)skippedTables.push('Factures');

    const detFields=dcData.dettes.map(d=>({Nom:d.nom,Creancier:d.credancier||'',
      MontantTotal:parseFloat(d.montantTotal||0),MontantPaye:parseFloat(d.montantPaye||0),
      Mensualite:parseFloat(d.mensualite||0),DateDebut:d.dateDebut||null,Notes:d.notes||''}));
    r=await safeSyncTable(AT_TABLES.dettes, detFields);if(r.skipped)skippedTables.push('Dettes');

    const chgFields=dcData.charges.map(c=>({Nom:c.nom,Type:c.type,Montant:parseFloat(c.montant||0),
      Organisme:c.organisme||'',Notes:c.notes||'',Flux:c.flux||'D',Service:c.service||'FG',
      Historique:JSON.stringify(c.historique||[])}));
    r=await safeSyncTable(AT_TABLES.charges, chgFields);if(r.skipped)skippedTables.push('Charges');

    const t=new Date().toLocaleTimeString('fr-FR');
    if(skippedTables.length>0){
      atSetStatus('warn',`Sauvegardé, mais ${skippedTables.join(', ')} ignoré(s) car vide(s) en local`,t);
      notify(`⚠️ Protection anti-perte : ${skippedTables.join(', ')} n'a/ont pas été synchronisé(s) car vide(s) localement alors que des données existent sur Airtable. Recharge la page (🔄) avant de re-sauvegarder.`,'error');
    } else {
      atSetStatus('ok','Sauvegardé sur Airtable',t);
      notify('Sauvegardé sur Airtable','success');
    }
  }catch(e){
    atSetStatus('err','Erreur sauvegarde (rien n\'a été supprimé) : '+e.message);
    notify('Erreur : '+e.message+' — aucune donnée existante supprimée','error');
  }
  if(btn)btn.innerHTML='☁ Sauvegarder';
  airtableState.syncing=false;
}

// -- Import automatique des acomptes/soldes depuis les chantiers acceptés --
function chantierRefAlreadyImported(ref){
  for(let m=1;m<=12;m++){
    for(const s of SERVICES){
      if((data[m][s.code]||[]).some(o=>o.chantierRef===ref)) return true;
    }
  }
  return false;
}
async function syncChantiers(){
  if(!airtableState.token||!airtableState.base){notify('Configure Airtable d\'abord (⚙ Airtable)','error');return;}
  atSetStatus('warn','Synchronisation des chantiers...');
  try{
    const chantiers=await atGetAll(AT_TABLES.chantiers);
    let added=0;
    chantiers.forEach(r=>{
      const f=r.fields;
      const svc=(f.Region||'').toUpperCase().includes('LMPM')?'LMPM':'PRGO';
      const entreprise=f.Entreprise||'Chantier';

      if(f.Acompte && f.DateAcompte){
        const ref=r.id+':acompte';
        if(!chantierRefAlreadyImported(ref)){
          const mm=parseInt((f.DateAcompte+'').split('-')[1],10);
          if(mm>=1&&mm<=12){
            if(!data[mm][svc])data[mm][svc]=[];
            data[mm][svc].push({id:'new_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
              date:f.DateAcompte,libelle:`Acompte chantier — ${entreprise}`,type:'E',
              montant:parseFloat(f.Acompte),ordre:Date.now(),origine:'Chantier',chantierRef:ref});
            added++;
          }
        }
      }
      if(f.MontantFacture && f.DateFacture){
        const ref=r.id+':solde';
        if(!chantierRefAlreadyImported(ref)){
          const mm=parseInt((f.DateFacture+'').split('-')[1],10);
          if(mm>=1&&mm<=12){
            if(!data[mm][svc])data[mm][svc]=[];
            data[mm][svc].push({id:'new_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
              date:f.DateFacture,libelle:`Solde chantier — ${entreprise}`,type:'E',
              montant:parseFloat(f.MontantFacture),ordre:Date.now(),origine:'Chantier',chantierRef:ref});
            added++;
          }
        }
      }
    });
    updateBadges();render();
    atSetStatus('ok',(added>0?added+' échéance(s) chantier importée(s)':'Aucune nouvelle échéance chantier'),new Date().toLocaleTimeString('fr-FR'));
    notify(added>0?`${added} échéance(s) chantier importée(s) — pense à cliquer ☁ Sauvegarder`:'Aucune nouvelle échéance chantier','success');
  }catch(e){
    atSetStatus('err','Erreur sync chantiers : '+e.message);
    notify('Erreur : '+e.message,'error');
  }
}

// Auto-sauvegarde toutes les 5 minutes si configuré
setInterval(()=>{if(airtableState.token && airtableState.base && !airtableState.syncing) airtableSaveAll();}, 5*60*1000);

// Chargement automatique au démarrage si déjà configuré
window.addEventListener('load',()=>{
  if(airtableState.token && airtableState.base){
    setTimeout(airtableLoadAll, 300);
  }
});

initNav();updateBadges();
</script>
